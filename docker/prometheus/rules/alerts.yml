groups:
  - name: diaryarchive
    rules:
      - alert: BackendDown
        expr: up{job="diaryarchive-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DiaryArchive backend is down"
          description: "Backend has been unreachable for more than 2 minutes."

      - alert: HighErrorRate
        expr: sum(rate(request_errors_total[5m])) / sum(rate(request_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 5 minutes."

      - alert: HighAverageLatency
        expr: sum(rate(request_duration_seconds_sum[5m])) / sum(rate(request_duration_seconds_count[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High average response latency"
          description: "Average response latency is above 2 seconds for the last 5 minutes."
