# Production overlay. Used with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay is where all production-grade hardening lives:
#   - required (fail-closed) secrets, no dev defaults
#   - image pins, resource limits, restart policies, healthchecks
#   - build-time NEXT_PUBLIC_API_URL (inlined by Next.js at build time)
#   - frontend NOT exposed on a public host port (all traffic through Nginx)
#   - P3.8: Docker log rotation to prevent disk exhaustion
#
# x-logging: &default-logging  (YAML anchor applied to all services)
#   logging:
#     driver: json-file
#     options:
#       max-size: "10m"
#       max-file: "5"
secrets:
  metrics_token:
    file: ${METRICS_TOKEN_FILE:?set METRICS_TOKEN_FILE to a root-readable secret file}

services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
  mongodb:
    command: ["mongod", "--replSet", "diaryarchive", "--auth", "--keyFile", "/etc/mongo/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    volumes:
      - ./docker/mongodb/keyfile:/etc/mongo/keyfile:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: always
    security_opt:
      - no-new-privileges:true

  mongo-app-user:
    image: mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./docker/mongo/create-app-user.sh:/usr/local/bin/create-app-user.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/create-app-user.sh"]

  redis:
    image: redis:7.2-alpine@sha256:2c933526722b4126a61d5c170f766dc159adf97682f0b1cbbc27b1666ba96d84
    volumes:
      - ./docker/redis/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    security_opt:
      - no-new-privileges:true

  meilisearch:
    image: getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    command: meilisearch --env production --master-key ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always
    security_opt:
      - no-new-privileges:true

  backend:
    read_only: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    secrets:
      - metrics_token
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo-app-user:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # NOTE: This architecture deliberately operates as a SINGLE backend
      # instance. `deploy.replicas` is IGNORED by plain `docker compose up`
      # (it only applies to Swarm), so claiming multiple replicas here would be
      # dishonest. A single stateless backend scales vertically; horizontal
      # scaling would require a real orchestrator (Swarm/K8s) and is out of
      # scope for this single-host deployment. See docs/ops/deployment.md.
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always
    environment:
      DEBUG: "false"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      COMMIT_HASH: ${COMMIT_HASH:-unknown}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
      MONGODB_URI: mongodb://${MONGO_APP_USER:?set MONGO_APP_USER}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongodb:27017/diaryarchive?authSource=diaryarchive&replicaSet=diaryarchive&maxPoolSize=20&minPoolSize=2
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars, random)}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?set EMAIL_ENCRYPTION_KEY (64-char hex, random)}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL (for example https://diaryarchive.com)}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.diaryarchive.com}
      CORS_ORIGINS: '["https://diaryarchive.com"]'
      TRUSTED_PROXY_CIDRS: '["172.16.0.0/12"]'
      METRICS_TOKEN_FILE: /run/secrets/metrics_token

  frontend:
    read_only: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://api.diaryarchive.com/api/v1
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: always
