# Production overlay. Used with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay is where all production-grade hardening lives:
#   - required (fail-closed) secrets, no dev defaults
#   - image pins, resource limits, restart policies, healthchecks
#   - build-time NEXT_PUBLIC_API_URL (inlined by Next.js at build time)
#   - frontend NOT exposed on a public host port (all traffic through Nginx)
#   - P3.8: Docker log rotation to prevent disk exhaustion
#
# x-logging: &default-logging  (YAML anchor applied to all services)
#   logging:
#     driver: json-file
#     options:
#       max-size: "10m"
#       max-file: "5"
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: always

  redis:
    image: redis:7.2-alpine
    volumes:
      - ./docker/redis/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always

  meilisearch:
    image: getmeili/meilisearch:v1.12
    command: meilisearch --env production --master-key ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always

  backend:
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      # NOTE: This architecture deliberately operates as a SINGLE backend
      # instance. `deploy.replicas` is IGNORED by plain `docker compose up`
      # (it only applies to Swarm), so claiming multiple replicas here would be
      # dishonest. A single stateless backend scales vertically; horizontal
      # scaling would require a real orchestrator (Swarm/K8s) and is out of
      # scope for this single-host deployment. See docs/ops/deployment.md.
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: always
    environment:
      DEBUG: "false"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:?set MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongodb:27017/diaryarchive?authSource=admin&replicaSet=diaryarchive
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 chars, random)}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?set EMAIL_ENCRYPTION_KEY (64-char hex, random)}
      CORS_ORIGINS: '["https://diaryarchive.com"]'

  frontend:
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://api.diaryarchive.com/api/v1
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: always