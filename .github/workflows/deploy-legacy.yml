name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual emergency fallback only. Automatic deployment is owned by ci-cd.yml.
    if: github.repository == 'PaullyScripter/diaryArchive'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (versioned + migration + rollback)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ${{ vars.DEPLOY_DIR }}
            # deploy.sh: checks out the commit SHA, runs the migration/index
            # stage, builds immutable commit-tagged images, health-checks, and
            # rolls back to the previous known-good deployment on failure.
            ./docker/scripts/deploy.sh ${{ github.sha }}
