services:
  mongodb:
    image: mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Docker Hub no longer serves the historical MinIO community image. This
    # archived, digest-pinned mirror contains the same 2024-06-13 source build
    # and is used only for local development until a maintained image source is
    # selected for deployment.
    image: bitnamilegacy/minio:2024.6.13@sha256:aa1752895e6d2b420e394d55241d5b2c948960715db0a50bb648f430e447e645
    # The archived compatibility image is non-root, while a newly created
    # Docker named volume is root-owned. Local development uses root here so
    # MinIO can initialize and maintain its data directory.
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      # Keep the prior MinIO volume intact; its metadata belongs to an
      # incompatible server build and must not be reused by local development.
      - minio_data_compat:/bitnami/minio/data
    command: minio server /bitnami/minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  meilisearch_data:
  minio_data_compat:
