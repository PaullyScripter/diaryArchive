[project]
name = "diaryarchive-backend"
version = "0.1.0"
description = "DiaryArchive backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.129.2",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "motor==3.7.1",
    "redis[hiredis]==8.0.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[argon2]==1.7.4",
    "python-multipart==0.0.22",
    "httpx==0.28.1",
    "bleach[css]==6.4.0",
    "tinycss2==1.5.1",
    "meilisearch==0.41.1",
    "minio==7.2.20",
    "Pillow==12.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
